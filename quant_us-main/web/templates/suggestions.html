<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>大模型选股建议 - quant_us</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
         margin: 0; background: #0f1117; color: #e2e8f0; }
  header { background: #1a1d27; border-bottom: 1px solid #2d3748; color: #fff;
           padding: 14px 22px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; }
  .nav-tabs { display: flex; gap: 8px; margin-left: 6px; }
  .nav-tab { color: #94a3b8; text-decoration: none; font-size: 13px;
             padding: 4px 10px; border-radius: 6px; }
  .nav-tab:hover { color: #fff; background: #2d3748; }
  .nav-tab.active { color: #fff; background: #2563eb; }
  .muted { color: #64748b; font-size: 13px; margin-left: auto; }
  main { max-width: 1080px; margin: 20px auto; padding: 0 16px; }
  .empty { text-align: center; color: #6b7280; padding: 60px 0; font-size: 15px; line-height: 1.8; }
  .summary { background: #1a1d27; border: 1px solid #2d3748; border-radius: 10px;
             padding: 14px 18px; margin-bottom: 16px; font-size: 14px; line-height: 1.6; }
  .card { background: #1a1d27; border: 1px solid #2d3748; border-radius: 10px;
          padding: 16px 18px; margin-bottom: 14px; border-left: 5px solid #38bdf8; }
  .card.US { border-left-color: #38bdf8; }
  .card.HK { border-left-color: #f59e0b; }
  .card.added { opacity: .6; }
  .card.ignored { opacity: .45; }
  .card.research { border-left-color: #a78bfa; background: #191624; }
  .card.research .dir { background: #312e81; color: #c4b5fd; }
  .summary.research { border-left: 4px solid #a78bfa; }
  .row { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .mkt { font-size: 12px; padding: 2px 8px; border-radius: 10px; font-weight: 700; }
  .mkt.US { background: #0ea5e9; color: #fff; }
  .mkt.HK { background: #d97706; color: #fff; }
  .code { font-size: 17px; font-weight: 700; }
  .dir { font-size: 13px; padding: 2px 8px; border-radius: 10px; }
  .dir.多头 { background: #dcfce7; color: #15803d; }
  .dir.观察 { background: #e0f2fe; color: #0369a1; }
  .dir.空头 { background: #fee2e2; color: #b91c1c; }
  .status { margin-left: auto; font-size: 13px; color: #94a3b8; }
  .field { font-size: 13px; color: #94a3b8; margin: 6px 0; }
  .field b { color: #e2e8f0; }
  .section { font-size: 12px; font-weight: 700; color: #64748b; margin: 10px 0 4px; }
  .box { background: #0f1117; border: 1px solid #2d3748; border-radius: 8px;
         padding: 10px 12px; font-size: 13px; line-height: 1.55; margin-bottom: 6px; }
  .actions { display: flex; gap: 10px; margin-top: 12px; }
  button { border: 0; border-radius: 8px; padding: 8px 20px; font-size: 14px;
           font-weight: 600; cursor: pointer; }
  button.add { background: #059669; color: #fff; }
  button.add:hover { background: #047857; }
  button.ignore { background: #374151; color: #fff; }
  button.ignore:hover { background: #4b5563; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .legacy-title { font-size: 14px; font-weight: 700; color: #e2e8f0;
                  margin: 18px 0 8px; }
  .legacy-title .muted { font-size: 12px; }
  details.legacy-fold { background: #1a1d27; border: 1px solid #2d3748;
                        border-radius: 8px; padding: 8px 14px; }
  details.legacy-fold summary { cursor: pointer; color: #94a3b8; font-size: 13px;
                                padding: 4px 0; }
  details.legacy-fold summary:hover { color: #e2e8f0; }
  details.legacy-fold[open] summary { margin-bottom: 6px; }
  .readonly-note { font-size: 12px; color: #64748b; margin-top: 6px; }
  .tips { font-size: 12px; color: #64748b; margin-top: 16px; line-height: 1.7; }
</style>
</head>
<body>
<header>
  <h1>大模型选股建议</h1>
  <nav class="nav-tabs">
    <a class="nav-tab" href="/">行情</a>
    <a class="nav-tab" href="/approvals">确认台</a>
    <a class="nav-tab active" href="/suggestions">LLM建议</a>
  </nav>
  <span id="meta" class="muted"></span>
</header>
<main>
  <div class="summary" id="summary">加载中…</div>
  <div class="summary research" id="research" style="display:none"></div>
  <div id="content"></div>
  <div class="tips">
    🔬 紫色「LLM 研究候选」：由 run_daily_selection.py 生成的最新影子研究排名，非交易信号、不直接下单。
    <br>📜 蓝色「历史宏观建议」：由 run_suggestions.py 生成的宏观报告建议；仅最新(新鲜)批次可操作（加入观察池），
    陈旧批次只读回看，不代表系统当前仍认为值得观察。
    <br>所有加入观察池的代码仍需通过策略评分并到「买入确认台」点单才会执行。大模型永远不能直接下单。
  </div>
</main>
<script>
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function card(c, allowActions) {
  const st = c.status || 'pending';
  // 陈旧建议：不可操作（去掉按钮，仅供回看）；fresh 且 pending 才显示操作按钮
  const buttons = (st === 'pending' && allowActions)
    ? '<div class="actions"><button class="add" data-id="' + esc(c.id) + '">加入观察池</button>' +
      '<button class="ignore" data-id="' + esc(c.id) + '">忽略</button></div>' : '';
  return '<div class="card ' + esc(c.market) + ' ' + esc(st) + '">' +
    '<div class="row"><span class="mkt ' + esc(c.market) + '">' + esc(c.market) + '</span>' +
    '<span class="code">' + esc(c.code) + '</span>' +
    '<span class="name">' + esc(c.name || '') + '</span>' +
    '<span class="dir ' + esc(c.direction || '') + '">' + esc(c.direction || '-') + '</span>' +
    '<span class="status">conf ' + esc((Number(c.confidence || 0) * 100).toFixed(0) + '%') +
    ' · ' + esc(c.horizon || '-') + (st !== 'pending' ? ' · ' + esc(st === 'added' ? '已加入' : '已忽略') : '') +
    '</span></div>' +
    '<div class="section">推荐逻辑（报告依据）</div><div class="box">' + esc(c.rationale || '-') + '</div>' +
    (c.catalyst ? '<div class="field">催化：<b>' + esc(c.catalyst) + '</b></div>' : '') +
    (c.risks ? '<div class="field">风险：<b>' + esc(c.risks) + '</b></div>' : '') +
    buttons + '</div>';
}
function researchCard(c) {
  const entry = {pullback:'回调买入', breakout:'突破', dip_buy:'抄底', none:'无建议'}[c.preferred_entry_mode] || c.preferred_entry_mode;
  const conf = {low:'低', medium:'中', high:'高'}[c.confidence_bucket] || c.confidence_bucket;
  return '<div class="card research">' +
    '<div class="row"><span class="code">' + esc(c.code) + '</span>' +
    '<span class="dir">#' + esc(c.rank) + '</span>' +
    '<span class="dir">' + esc(entry) + '</span>' +
    '<span class="status">信心桶 ' + esc(conf) + '（非胜率）· ' + esc(c.horizon || '-') + '</span></div>' +
    '<div class="section">论点</div><div class="box">' + esc(c.thesis || '-') + '</div>' +
    (c.watch_conditions && c.watch_conditions.length ? '<div class="field">观察条件：<b>' + esc(c.watch_conditions.join('；')) + '</b></div>' : '') +
    (c.invalidators && c.invalidators.length ? '<div class="field">失效条件：<b>' + esc(c.invalidators.join('；')) + '</b></div>' : '') +
    (c.missing_information && c.missing_information.length ? '<div class="field">资料缺口：<b>' + esc(c.missing_information.join('；')) + '</b></div>' : '') +
    '</div>';
}
function renderResearch(research) {
  const el = document.getElementById('research');
  if (!research || !(research.candidates || []).length) {
    el.style.display = 'none';
    return;
  }
  const batch = (research.research_batch_id || '').slice(0, 12);
  el.style.display = 'block';
  el.innerHTML = '<b>🔬 LLM 研究候选（研究建议，不是交易信号）</b>' +
    '<br><span class="muted">批次 ' + esc(batch) + ' · 模型 ' + esc(research.model || '-') +
    ' · prompt ' + esc(research.prompt_version || '-') + ' · 基础池 ' + esc((research.universe || []).length) + ' 只</span>' +
    research.candidates.map(researchCard).join('');
}
async function load() {
  try {
    const r = await fetch('/api/suggestions');
    const d = await r.json();
    renderResearch(d.research);
    const data = d.data || {};
    const cs = data.candidates || [];
    const now = new Date().toLocaleString('zh-CN', { hour12: false });
    document.getElementById('meta').textContent = now + ' · ' + cs.length + ' 条建议 · ' +
      '美股池 ' + (d.us_watch || []).length + ' 只';
    const s = document.getElementById('summary');
    if (!data.generated_at) {
      s.innerHTML = '⚠️ 还没有生成建议。<br>先运行：<b>python scripts/live_trading/llm_suggestions/run_suggestions.py</b>';
    } else {
      const gen = data._generated || {};
      const srcPre = (data._sources || {}).pre || {};
      const srcPost = (data._sources || {}).post || {};
      const freshLabel = {fresh:'🟢 新鲜', stale:'🟡 陈旧', unknown_tz:'⚪ 时区未知',
        future:'🔴 未来时间', missing:'⚪ 时间缺失', invalid:'⚪ 时间无效'}[data._freshness] || data._freshness || '-';
      const srcTxt = (src) => src.status === 'missing' ? '无'
        : esc(src.label || '-') + '（' + esc(src.fresh || src.status || '-') + '）';
      s.innerHTML = '<b>宏观结论：</b>' + esc(data.summary || '-') +
        '<br><span class="muted">生成于 ' + esc(data.generated_at) + '（' + esc(gen.label || '-') + '）· ' + esc(freshLabel) + '</span>' +
        '<br><span class="muted">盘前来源: ' + srcTxt(srcPre) + ' · 盘后来源: ' + srcTxt(srcPost) +
        '<br>来源时间只反映报告文件新旧，不代表其中行情/新闻已核实。</span>';
    }
    const el = document.getElementById('content');
    if (!cs.length) {
      el.innerHTML = '<div class="empty">暂无历史宏观建议</div>';
      return;
    }
    // 历史宏观建议区：独立于上方紫色「LLM 研究候选」
    // 仅新鲜批次(fresh)显示操作按钮；陈旧批次默认折叠、只读回看
    const actionable = data._freshness === 'fresh';
    const batchLabel = (data._generated || {}).label || data.generated_at || '未知批次';
    const head = '<div class="legacy-title">📜 历史宏观建议' +
      ' <span class="muted">· ' + esc(batchLabel) +
      (actionable ? '' : ' · 陈旧/仅回看（非最新批次不可操作）') + '</span></div>';
    const cardsHtml = cs.map(c => card(c, actionable)).join('');
    el.innerHTML = head + (actionable ? cardsHtml :
      '<details class="legacy-fold"><summary>展开 ' + cs.length + ' 条历史建议（只读回看）</summary>' +
      cardsHtml + '</details>');
  } catch (e) {
    document.getElementById('content').innerHTML = '<div class="empty">连接失败：' + esc(e.message || e) + '</div>';
  }
}
document.addEventListener('click', async function (e) {
  const btn = e.target.closest('button[data-id]');
  if (!btn) return;
  btn.disabled = true;
  const action = btn.classList.contains('add') ? 'add' : 'ignore';
  try {
    const r = await fetch('/api/suggestions/' + encodeURIComponent(btn.dataset.id) + '/' + action,
      { method: 'POST' });
    const res = await r.json();
    if (res.message) alert(res.message);
    if (!res.ok && res.error) alert(res.error);
  } catch (err) {
    alert('网络错误：' + err.message);
  } finally {
    load();
  }
});
load();
setInterval(load, 5000);
</script>
</body>
</html>
