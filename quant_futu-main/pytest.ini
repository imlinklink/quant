[pytest]
# pytest 配置文件

# 测试文件匹配模式
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# 测试路径
testpaths = tests

# 命令行选项
addopts = 
    # 详细输出
    -v
    # 显示测试进度
    --tb=short
    # 显示本地变量
    -l
    # 警告设置
    -W ignore::DeprecationWarning
    # 覆盖率配置
    --cov=.
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-fail-under=0
    # 并行执行（需要pytest-xdist）
    # -n auto

# 标记定义
markers =
    unit: 单元测试
    integration: 集成测试
    slow: 慢速测试
    api: 需要API连接的测试
    database: 需要数据库连接的测试
    live_trading: 需要实盘环境的测试

# 最小版本
minversion = 7.0

# 日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S

# 文件日志
log_file = logs/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_file_date_format = %Y-%m-%d %H:%M:%S

# 过滤警告
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::FutureWarning

# 测试发现
norecursedirs = 
    .git
    .tox
    .env
    dist
    build
    *.egg
    __pycache__
    .pytest_cache
    htmlcov
    logs

# 覆盖率配置
[coverage:run]
source = .
omit = 
    */tests/*
    */__pycache__/*
    */site-packages/*
    */distutils/*
    */venv/*
    */.tox/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov
